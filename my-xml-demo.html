<button onclick="read()">Read XML</button>
<h1 id="out"></h1>

<script>
    function read() {
        fetch('data.xml')
            .then(res => res.text())
            .then(str => {
                let xml = new DOMParser().parseFromString(str, "text/xml");
                let name = xml.querySelector("name").textContent;
                let age = xml.querySelector("age").textContent;
                let college = xml.querySelector("college").textContent;
                let city = xml.querySelector("city").textContent;
                let state = xml.querySelector("state").textContent;
                
                document.getElementById("out").innerHTML = 
                    name + " is " + age + " years old.<br>" +
                    "Studying at: " + college + "<br>" +
                    "Location: " + city + ", " + state;
            });
    }
</script>
